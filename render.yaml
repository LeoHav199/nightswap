# Render blueprint: connect this repository in Render ("New → Blueprint") and it sets everything up.
services:
  - type: web
    name: nightswap
    runtime: python
    plan: starter            # needed for the persistent disk (about $7/month)
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /robots.txt
    disk:
      name: nightswap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NIGHTSWAP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: TASK_SECRET
        generateValue: true
      # Render asks for these when you create the service:
      - key: ADMIN_EMAILS          # your email, so you can open /admin
        sync: false
      - key: STRIPE_SECRET_KEY     # sk_test_... for the beta
        sync: false
      - key: SMTP_HOST             # Brevo: smtp-relay.brevo.com
        sync: false
      - key: SMTP_USER             # Brevo SMTP login
        sync: false
      - key: SMTP_PASSWORD         # Brevo SMTP key
        sync: false
      - key: MAIL_FROM             # e.g. Nightswap <you@icloud.com>, a sender verified in Brevo
        sync: false
      # Add later under Environment, when you have them:
      #   BASE_URL (your own domain, e.g. https://nightswap.nl), STRIPE_WEBHOOK_SECRET,
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM (until then phone codes go by email)
