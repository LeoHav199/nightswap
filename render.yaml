# Render blueprint: connect this repository in Render ("New → Blueprint") and it sets everything up.
# The service, disk and NIGHTSWAP_* names keep the old project name on purpose: renaming them here
# would make Render create a new, empty service instead of updating the live one.
services:
  - type: web
    name: nightswap
    runtime: python
    plan: starter            # needed for the persistent disk (about $7/month)
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /robots.txt
    disk:
      name: nightswap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NIGHTSWAP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: TASK_SECRET
        generateValue: true
      # Render asks for these when you create the service:
      - key: ADMIN_EMAILS          # your email, so you can open /admin
        sync: false
      - key: STRIPE_SECRET_KEY     # sk_test_... for the beta
        sync: false
      - key: SMTP_HOST             # iCloud: smtp.mail.me.com (Brevo: smtp-relay.brevo.com)
        sync: false
      - key: SMTP_USER             # iCloud: your @icloud.com address (Brevo: SMTP login)
        sync: false
      - key: SMTP_PASSWORD         # iCloud: app-specific password (Brevo: SMTP key)
        sync: false
      - key: MAIL_FROM             # e.g. Spare <you@icloud.com>, must be the same iCloud address
        sync: false
      # Add later under Environment, when you have them:
      #   BASE_URL (your own domain, e.g. https://sparetickets.eu), STRIPE_WEBHOOK_SECRET,
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM (until then phone codes go by email)
