{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}{{ t('student_title') }} · Nightswap{% endblock %}
{% block content %}
<div class="wrap auth">
  <form class="panel form" method="post" data-once>
    {{ m.csrf() }}
    <h1>{{ t('student_title') }}</h1>
    <p class="muted">{{ t('student_sub') }}</p>
    <label class="field">
      <span class="label">{{ t('student_email') }}</span>
      <input type="email" name="email" value="{{ email }}" autocomplete="email" placeholder="123456ab@student.eur.nl" required autofocus>
      {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
      <span class="hint">{{ t('student_schools', list=', '.join(schools)) }}</span>
    </label>
    <button class="btn btn-accent btn-block btn-lg" type="submit">{{ t('send_code') }}</button>
  </form>
</div>
{% endblock %}
